name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build e testes
        run: ./mvnw -B verify
      # Publica o JAR como artefato baixável a cada execução na main (issue #13).
      - name: Publicar JAR
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: alarmed-jar
          path: target/alarmed-*.jar
          if-no-files-found: error

  # Front-end: linter (ESLint, TD-07) e testes (regras de domínio, adaptador
  # HTTP, service worker e contraste do RNF001). Roda em paralelo com o back-end.
  # O ESLint é a única dependência, e só de desenvolvimento.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências de desenvolvimento
        run: npm ci
      - name: Linter do front-end
        run: npm run lint
      - name: Testes do front-end
        run: node --test
