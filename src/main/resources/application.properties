spring.application.name=alarmed
spring.config.import=optional:file:.env[.properties]

# Banco (PostgreSQL). Valores padrao servem apenas para desenvolvimento local com docker-compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alarmed}
spring.datasource.username=${DB_USER:alarmed}
spring.datasource.password=${DB_PASSWORD:alarmed}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health

# Web Push (VAPID). Nunca versionar as chaves: defina por variavel de ambiente.
alarmed.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
alarmed.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
alarmed.push.vapid.subject=${VAPID_SUBJECT:mailto:contato@example.com}

# Bloco D: instantes em UTC; horários do plano no fuso informado na confirmação.
alarmed.fuso=${APP_ZONE:America/Maceio}
alarmed.doses.horizonte-dias=${DOSES_HORIZONTE_DIAS:7}
alarmed.agendador.ativo=${AGENDADOR_ATIVO:true}
alarmed.agendador.intervalo-ms=${AGENDADOR_INTERVALO_MS:30000}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework
