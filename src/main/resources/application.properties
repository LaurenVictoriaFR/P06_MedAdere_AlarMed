spring.application.name=alarmed

# Banco (PostgreSQL). Valores padrao servem apenas para desenvolvimento local com docker-compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alarmed}
spring.datasource.username=${DB_USER:alarmed}
spring.datasource.password=${DB_PASSWORD:alarmed}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health

# Web Push (VAPID). Nunca versionar as chaves: defina por variavel de ambiente.
alarmed.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
alarmed.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
alarmed.push.vapid.subject=${VAPID_SUBJECT:mailto:contato@example.com}
