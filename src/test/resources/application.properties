spring.datasource.url=jdbc:h2:mem:alarmed;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

alarmed.agendador.ativo=false

# RF008: foto da caixa ate 2 MB (o service confere o limite exato e devolve 400).
# Limite do upload um pouco acima, pra caber o cabecalho do multipart.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
